services:
  - type: web
    name: Ai-bos-v1-1
    env: node
    buildCommand: bun install && bun run build:server
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=2048
      - key: PORT
        value: 10000

